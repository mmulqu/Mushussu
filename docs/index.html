<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Editor - Write & See Diffs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📝 Novel Editor</h1>
                <div class="header-controls">
                    <select id="file-select" class="file-select">
                        <option value="">Select a file...</option>
                    </select>
                    <button id="refresh-btn" class="btn-secondary" title="Refresh from GitHub">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                        </svg>
                        Refresh
                    </button>
                    <button id="save-btn" class="btn-primary" disabled>
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M13.5 1a1.5 1.5 0 0 1 1.5 1.5v11.75a.75.75 0 0 1-1.5 0V2.5a.25.25 0 0 0-.25-.25H2.75a.25.25 0 0 0-.25.25v11.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V9h1.5v5.25a1.75 1.75 0 0 1-1.75 1.75H2.75A1.75 1.75 0 0 1 1 14.25V2.5A1.5 1.5 0 0 1 2.5 1h11z"/>
                            <path d="M4.75 7.25a.75.75 0 0 0 0 1.5h4.5a.75.75 0 0 0 0-1.5h-4.5zm0 3a.75.75 0 0 0 0 1.5h2.5a.75.75 0 0 0 0-1.5h-2.5z"/>
                        </svg>
                        Commit & Push
                    </button>
                    <button id="settings-btn" class="btn-secondary" title="Settings">⚙️</button>
                </div>
            </div>
        </header>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button id="close-settings" class="btn-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Repository (owner/repo)</label>
                        <input type="text" id="repo-input" placeholder="mmulqu/Mushussu" value="mmulqu/Mushussu">
                    </div>
                    <div class="form-group">
                        <label>Branch</label>
                        <input type="text" id="branch-input" placeholder="main" value="main">
                    </div>
                    <div class="form-group">
                        <label>Novel Directory</label>
                        <input type="text" id="path-input" placeholder="Novel_original" value="Novel_original">
                    </div>
                    <div class="form-group">
                        <label>GitHub Token (required for push)</label>
                        <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
                        <small><a href="https://github.com/settings/tokens/new?scopes=repo" target="_blank">Create token</a> with 'repo' scope</small>
                    </div>
                    <div class="form-group">
                        <label>Author Name</label>
                        <input type="text" id="author-name" placeholder="Your Name" value="Novel Author">
                    </div>
                    <div class="form-group">
                        <label>Author Email</label>
                        <input type="email" id="author-email" placeholder="you@example.com" value="author@example.com">
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="save-settings" class="btn-primary">Save & Load Files</button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Editor Pane -->
            <div class="editor-pane">
                <div class="pane-header">
                    <h3>✏️ Editor</h3>
                    <div class="editor-info">
                        <span id="word-count">0 words</span>
                        <span id="change-indicator"></span>
                    </div>
                </div>
                <textarea id="editor" class="editor" placeholder="Click Settings (⚙️) to connect your repository..."></textarea>
            </div>

            <!-- Diff Pane -->
            <div class="diff-pane">
                <div class="pane-header">
                    <h3>🔍 Changes</h3>
                    <div class="diff-controls">
                        <button id="toggle-commits" class="btn-small">Recent Commits</button>
                    </div>
                </div>
                <div id="diff-view" class="diff-view">
                    <div class="empty-state">
                        <p>No changes yet</p>
                        <small>Edit the text to see differences</small>
                    </div>
                </div>

                <!-- Commits Panel (hidden by default) -->
                <div id="commits-panel" class="commits-panel" style="display: none;">
                    <div class="commits-header">
                        <h4>Recent Commits</h4>
                        <button id="close-commits" class="btn-close">×</button>
                    </div>
                    <div id="commits-list" class="commits-list">
                        <div class="loading">Loading commits...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div id="status-message">Ready</div>
            <div id="file-info"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
